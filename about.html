<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratham - Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Pratham</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html" class="active">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li class="nav-search">
                        <input type="text" placeholder="Search..." class="search-input">
                        <button class="btn small primary search-btn">Go</button>
                    </li>
                </ul>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="gallery-section">
            <h2>Image Gallery</h2>
            
            <!-- Image Slider -->
            <div class="image-slider">
                <!-- Radio Controls -->
                <div class="slider-controls">
                    <input type="radio" name="gallery-slider" id="img1" checked>
                    <input type="radio" name="gallery-slider" id="img2">
                    <input type="radio" name="gallery-slider" id="img3">
                </div>
    
                <!-- Slides -->
                <div class="slides">
                    <div class="slide active">
                        <img src="images/gallery1.jpg" alt="Gallery Image 1">
                    </div>
                    <div class="slide"> <!-- Remove "active" from others -->
                        <img src="images/gallery2.jpg" alt="Gallery Image 2">
                    </div>
                    <div class="slide">
                        <img src="images/gallery3.jpg" alt="Gallery Image 3">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Image Modal -->
    <div class="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="expanded-img">
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Pratham. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>

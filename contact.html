<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratham - Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Pratham</h1>
            <nav>
                <ul class="nav-links">
                    <!-- Existing navigation links -->
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>

                    <!-- Add search box as a list item -->
                    <li class="nav-search">
                        <input type="text" placeholder="Search..." class="search-input">
                        <button class="btn small primary search-btn">Go</button>
                    </li>
                </ul>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="contact-section">
            <h2>Get In Touch</h2>
            
            <div class="contact-container">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn primary">Send Message</button>
                </form>
                
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <ul class="contact-methods">
                        <li>
                            <i class="fas fa-map-marker-alt"></i>
                            <span>Siliguri, West Bengal, India</span>
                        </li>
                        <li>
                            <i class="fas fa-envelope"></i>
                            <a href="mailto:pratham.ag1@outlook.com" target="_blank">E-mail</a>
                        </li>
                        <li>
                            <i class="fas fa-phone"></i>
                             <a href="tel:8882192787"> Mobile Number </a>
                        </li>
                        <li>
                            <i class="fab fa-github"></i>
                            <a href="contact.html">Github</a>
                        </li>
                        <li>
                            <i class="fab fa-linkedin"></i>
                            <a href="contact.html">LinkedIn</a>
                        </li>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Pratham. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
